name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, build/windows-exe]
    paths:
      - "**.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name DomashniyByudzhet main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DomashniyByudzhet-Windows
          path: dist/DomashniyByudzhet.exe
          if-no-files-found: error
          retention-days: 30
